name: Offline policy and doctrine
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  peripheral-authority:
    name: Independent desktop peripheral safety gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Guard source against Windows service/driver/input configuration
        run: python -m scripts.check_peripheral_boundary
      - name: Synthetic hostile and permitted host effects
        run: python -m unittest tests.test_peripheral_boundary -v
      - name: P00 P01 native gameplay-first architecture and route enforcement
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python -m scripts.check_native_gameplay_authority --json
          python -m unittest tests.test_native_gameplay_authority -v
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            python -m scripts.check_native_gameplay_authority --base-ref "$PR_BASE_SHA"
          fi
      - name: Human-first P00/P01 ontology and cross-adapter coverage
        run: |
          python -m scripts.check_human_sovereignty --json
          python -m unittest tests.test_human_sovereignty_governance tests.test_human_first_harness -v
      - name: Cursor shell/file interception regressions
        run: python -m unittest tests.test_operator_boundary -v
      - name: Ontology schema and consultation chronology
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python -m scripts.check_ontology
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            python -m scripts.check_ontology --base-ref "$PR_BASE_SHA"
          fi
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install viewport test image dependency
        run: python -m pip install 'Pillow>=10,<13'
      - name: Offline tests
        run: python -m unittest discover -s tests -v
      - name: Protect older certified game builds
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
            if [[ "$BASE" =~ ^0+$ ]]; then BASE="$(git rev-parse HEAD^)"; fi
          fi
          python -m scripts.check_backward_compat --base-ref "$BASE"
      - name: Horizon dependency and scenario evaluators
        run: |
          python -m scripts.check_horizon
          python -m scripts.check_horizon_continuity
          python -m scripts.eval_horizon
          python -m scripts.horizon_status
      - name: Deterministic P95 P67 P62 host eval suite
        run: |
          python -m scripts.host_eval --out dist/host-eval/ci.json > /dev/null
          python -m unittest tests.test_host_eval -v
      - name: P00 P01 world-target ontology and harness completeness
        run: |
          python -m scripts.check_world_traversal_harness
          python -m unittest tests.test_world_traversal_harness -v
      - name: P00 P01 household navigation and no-oscillation regression
        run: |
          python -m scripts.check_household_navigation
          python -m unittest tests.test_household_navigation -v
      - name: World-target highlight and observed-outcome learning eval
        run: |
          python -m scripts.world_traversal_eval
          python -m unittest tests.test_world_traversal_learning -v
          python -m scripts.semantic_preflight --consultation contracts/consultations/BI-WORLD-HIGHLIGHT-TRAVERSAL-LEARNING-20261110.v1.json --operation repo_mutation --file betterinstincts/world_traversal_learning.py --file betterinstincts/host_stack.py
      - name: Progression rate and CI honesty eval (P67 P62)
        run: |
          python -m scripts.progression_eval --out dist/progression-eval/ci.json > /dev/null
          python -m scripts.progression_eval --repo-only
          python -m unittest tests.test_progression_eval -v
      - name: Event balance outdoor-social call stack
        run: python -m unittest tests.test_event_balance -v
      - name: Event goal action catalog
        run: python -m unittest tests.test_event_goals -v
      - name: Fun service tandem lanes
        run: python -m unittest tests.test_fun_service -v
      - name: Need services six-need tandem
        run: python -m unittest tests.test_need_services -v
      - name: Need load-balance health detach
        run: python -m unittest tests.test_need_load_balance -v
      - name: Domain cascade poll receipts
        run: python -m unittest tests.test_domain_cascade -v
      - name: Navigating Needs panel tandem
        run: python -m unittest tests.test_navigating_needs -v
      - name: Moodlet strip host sensing
        run: python -m unittest tests.test_moodlets -v
      - name: Semantic orchestration offline and consultation tests
        run: python -m unittest tests.test_semantic_advisory tests.test_ontology_gate -v
      - name: Local agent semantic preflight canary (no game access)
        run: python -m scripts.semantic_preflight --consultation contracts/consultations/BI-SEMANTIC-ORCHESTRATION-20261107.v1.json --operation repo_mutation --file betterinstincts/semantic_advisory.py
      - name: Doctrine fails closed
        run: python scripts/validate_doctrine.py
      - name: Ontology schema and canonical owner integrity
        run: python -m scripts.check_ontology
      - name: Ontology consultation predates prototype mutation (PR)
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python -m scripts.check_ontology --base-ref "$PR_BASE_SHA"
      - name: Repeated hidden catalog scout goal and checkpoint proof
        run: python -m unittest tests.test_hidden_object_scout -v
      - name: P04 hidden-object five-step guide and mandatory handoff routing
        run: python -m scripts.check_hidden_object_p04
      - name: Scene and save safety contract
        run: python -m scripts.check_scene_contract
      - name: Repo asset leakage prevention
        run: python scripts/check_tracked_assets.py
      - name: Commit whitespace hygiene
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          else
            git diff --check HEAD^..HEAD
          fi
      - name: Offline policy demo
        run: python -m betterinstincts.priority
      - name: Compile source
        run: python -m compileall -q betterinstincts scripts tests
