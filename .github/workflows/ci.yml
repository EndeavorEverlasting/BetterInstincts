name: Offline policy and doctrine
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Offline tests
        run: python -m unittest discover -s tests -v
      - name: Protect older certified game builds
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
            if [[ "$BASE" =~ ^0+$ ]]; then BASE="$(git rev-parse HEAD^)"; fi
          fi
          python -m scripts.check_backward_compat --base-ref "$BASE"
      - name: Horizon dependency and scenario evaluators
        run: |
          python -m scripts.check_horizon
          python -m scripts.eval_horizon
          python -m scripts.horizon_status
      - name: Doctrine fails closed
        run: python scripts/validate_doctrine.py
      - name: Repo asset leakage prevention
        run: python scripts/check_tracked_assets.py
      - name: Commit whitespace hygiene
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          else
            git diff --check HEAD^..HEAD
          fi
      - name: Offline policy demo
        run: python -m betterinstincts.priority
      - name: Compile source
        run: python -m compileall -q betterinstincts scripts tests
